name: Résumé hebdomadaire Strava

on:
  schedule:
    - cron: "0 18 * * 0"
    - cron: "0 19 * * 0"
  workflow_dispatch:
  # TEMPORAIRE (test) : un push sur ces fichiers déclenche un run forcé
  push:
    branches: [main]
    paths:
      - ".github/workflows/strava-weekly.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le résumé Strava
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          STRAVA_FORCE_RUN: ${{ github.event_name == 'push' && '1' || '' }}
        run: python scripts/strava_summary.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "strava-bot"
          git config user.email "strava-bot@users.noreply.github.com"
          git add summaries/ config/
          git commit -m "Résumé Strava du $(date +'%Y-%m-%d')" || echo "Rien à commiter"
          git push
