name: Résumé hebdomadaire Strava

on:
  schedule:
    # GitHub ne gère que l'UTC : on déclenche aux deux créneaux possibles
    # (18:00 UTC = 20:00 Paris en été, 19:00 UTC = 20:00 Paris en hiver)
    # et le script vérifie l'heure réelle de Paris avant de s'exécuter.
    - cron: "0 18 * * 0"
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le résumé Strava (uniquement s'il est 20h à Paris)
        run: python scripts/strava_summary.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "strava-bot"
          git config user.email "strava-bot@users.noreply.github.com"
          git add summaries/ config/
          git commit -m "Résumé Strava du $(date +'%Y-%m-%d')" || echo "Rien à commiter"
          git push
