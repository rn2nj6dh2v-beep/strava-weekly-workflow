name: intervals.icu — données VFC quotidiennes

on:
  schedule:
    # 8h00 Paris : 07:00 UTC en hiver, 06:00 UTC en été.
    # Le script vérifie l'heure réelle de Paris avant de s'exécuter.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Nombre de jours wellness à récupérer (3 par défaut ; 90 pour un rattrapage historique)"
        required: false
        default: "3"
      archive_backfill_days:
        description: "Archive cumulée d'activités : horizon de rattrapage en jours (365 par défaut ; 0 pour désactiver ; ex. 730 pour 2 ans)"
        required: false
        default: "365"

permissions:
  contents: write

jobs:
  vfc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe des scripts
        run: python -m py_compile scripts/intervals_hrv.py scripts/intervals_summary.py scripts/intervals_monthly.py scripts/intervals_coach.py

      - name: Récupérer les données wellness intervals.icu (si ~8h à Paris)
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          INTERVALS_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '3' }}
          INTERVALS_ACTIVITES_BACKFILL_JOURS: ${{ github.event.inputs.archive_backfill_days || '365' }}
        run: python scripts/intervals_hrv.py

      - name: Coach du matin — deux séances par email (si ~8h à Paris)
        if: always()
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          INTERVALS_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/intervals_coach.py
      - name: Enregistrer les résultats
        run: |
          git config user.name "intervals-bot"
          git config user.email "intervals-bot@users.noreply.github.com"
          if [ -d summaries/intervals ]; then
            git add summaries/intervals/
            git commit -m "Données intervals.icu du $(date +'%Y-%m-%d')" || echo "Rien à commiter"
            git push
          else
            echo "Aucune donnée à enregistrer (répertoire absent) — rien à commiter"
          fi
