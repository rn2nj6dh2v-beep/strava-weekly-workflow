name: Résumé hebdomadaire (intervals.icu)

on:
  schedule:
    # 23h Paris : 21:00 UTC en hiver, 22:00 UTC en été
    # le script vérifie l'heure réelle de Paris avant de s'exécuter.
    - cron: "0 21 * * 0"
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer matplotlib (graphiques du résumé)
        run: pip install --quiet matplotlib

      - name: Générer le résumé intervals.icu (uniquement s'il est 23h à Paris)
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/intervals_summary.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "intervals-bot"
          git config user.email "intervals-bot@users.noreply.github.com"
          git add summaries/
          git commit -m "Résumé intervals.icu du $(date +'%Y-%m-%d')" || echo "Rien à commiter"
          git push
